<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | 募集さん</title>
  <meta name="description" content="お探しのページは存在しないか移動されました。募集さん公式サイトのホームへ戻ることができます。">
  <meta name="keywords" content="募集さん,404,ページが見つかりません">
  <meta name="theme-color" content="#5865F2">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="./404.html">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="404 | 募集さん">
  <meta property="og:description" content="お探しのページは存在しないか移動されました。">
  <meta property="og:url" content="./404.html">
  <meta property="og:image" content="assets/logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="404 | 募集さん">
  <meta name="twitter:description" content="お探しのページは存在しないか移動されました。">
  <meta name="twitter:image" content="assets/logo.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "404 | 募集さん",
    "description": "お探しのページは存在しないか移動されました。",
    "url": "./404.html"
  }
  </script>
  <style>
    :root {
      --primary: #5865F2;
      --secondary: #4752C4;
      --background: #0f1117;
      --card: #1a1d27;
      --card2: #202531;
      --text: #ffffff;
      --text-muted: #b5bac1;
      --success: #57F287;
      --danger: #ED4245;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(88, 101, 242, 0.34), transparent 28rem),
        radial-gradient(circle at 86% 78%, rgba(237, 66, 69, 0.12), transparent 25rem),
        linear-gradient(180deg, #111421 0%, var(--background) 55%, #090a0e 100%);
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 17, 23, 0.76);
      backdrop-filter: blur(18px);
    }
    .nav {
      width: min(100% - 32px, 1120px);
      height: 74px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.08rem;
    }
    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(88, 101, 242, 0.35);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-links a {
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.94rem;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      outline: none;
    }
    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      cursor: pointer;
    }
    .menu-toggle span {
      display: block;
      width: 20px;
      height: 2px;
      margin: 5px auto;
      border-radius: 999px;
      background: currentColor;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    main {
      min-height: 100vh;
      width: min(100% - 32px, 920px);
      margin: 0 auto;
      padding: 126px 0 56px;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .not-found {
      position: relative;
      width: 100%;
      padding: 54px 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: linear-gradient(160deg, rgba(32, 37, 49, 0.78), rgba(26, 29, 39, 0.58));
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }
    .not-found::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 26px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(88, 101, 242, 0.24);
      filter: blur(34px);
      transform: translateX(-50%);
      z-index: -1;
      animation: pulse 3.2s ease-in-out infinite;
    }
    .logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 18px;
      border-radius: 22px;
      box-shadow: 0 20px 48px rgba(88, 101, 242, 0.38);
      animation: float 3.4s ease-in-out infinite;
    }
    .code {
      margin: 0;
      font-size: clamp(5.2rem, 22vw, 11rem);
      line-height: 0.92;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 18px 52px rgba(88, 101, 242, 0.45);
      letter-spacing: 0;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(1.8rem, 6vw, 3.3rem);
      letter-spacing: 0;
    }
    p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: var(--text-muted);
      line-height: 1.8;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-weight: 800;
      box-shadow: 0 16px 36px rgba(88, 101, 242, 0.36);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .button:hover,
    .button:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 20px 42px rgba(88, 101, 242, 0.3);
      outline: none;
    }
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.9; transform: translateX(-50%) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .reveal { opacity: 1; transform: none; }
    }
    @media (max-width: 720px) {
      .nav { height: 66px; }
      .menu-toggle { display: block; }
      .nav-links {
        position: fixed;
        top: 66px;
        left: 16px;
        right: 16px;
        display: grid;
        gap: 6px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(15, 17, 23, 0.96);
        box-shadow: var(--shadow);
        transform: translateY(-12px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .nav-links.is-open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }
      .nav-links a { padding: 13px 12px; }
      main { padding-top: 104px; }
      .not-found { padding: 38px 18px; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="グローバルナビゲーション">
      <a class="brand" href="index.html" aria-label="募集さん ホーム">
        <img src="assets/logo.png" alt="" width="42" height="42">
        <span>募集さん</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-controls="nav-links" aria-expanded="false" data-menu-toggle>
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links" data-nav-links>
        <a href="index.html">ホーム</a>
        <a href="terms.html">利用規約</a>
        <a href="privacy.html">プライバシーポリシー</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="not-found reveal" aria-labelledby="not-found-title">
      <img class="logo" src="assets/logo.png" alt="募集さん ロゴ" width="86" height="86">
      <p class="code" aria-hidden="true">404</p>
      <h1 id="not-found-title">ページが見つかりません</h1>
      <p>お探しのページは存在しないか移動されました。</p>
      <a class="button" href="index.html">ホームへ戻る</a>
    </section>
  </main>

  <script>
    (() => {
      const toggle = document.querySelector("[data-menu-toggle]");
      const navLinks = document.querySelector("[data-nav-links]");
      const closeMenu = () => {
        navLinks.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "メニューを開く");
      };
      toggle.addEventListener("click", () => {
        const isOpen = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!isOpen));
        toggle.setAttribute("aria-label", isOpen ? "メニューを開く" : "メニューを閉じる");
        navLinks.classList.toggle("is-open", !isOpen);
      });
      navLinks.querySelectorAll("a").forEach((link) => link.addEventListener("click", closeMenu));
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.16 });
      document.querySelectorAll(".reveal").forEach((target) => observer.observe(target));
      window.addEventListener("resize", () => { if (window.innerWidth > 720) closeMenu(); });
    })();
  </script>
</body>
</html>
